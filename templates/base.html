<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>CineStats – {% block titel %}{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #222; }
        nav { background: #1f2937; padding: .8rem 2rem; }
        nav a { color: #e5e7eb; margin-right: 1.2rem; text-decoration: none; }
        nav a:hover { color: #fff; }
        main { max-width: 1000px; margin: 1.5rem auto; background: #fff; padding: 1.5rem 2rem; border-radius: 8px; }
        table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
        th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #e5e7eb; }
        th { background: #f3f4f6; }
        form { margin: 1rem 0; }
        input, select, button { padding: .35rem .5rem; }
        .hinweis { background: #eef2ff; padding: .6rem 1rem; border-radius: 6px; }
        .Top { color: #15803d; } .Solide { color: #a16207; } .Schwach { color: #b91c1c; }
    </style>
</head>
<body>
<nav>
    <a href="{{ url_for('suche_route') }}">Suche</a>
    <a href="{{ url_for('statistik_route') }}">Statistik</a>
    <a href="{{ url_for('ranking_route') }}">Ranking</a>
    <a href="{{ url_for('empfehlungen_route') }}">Empfehlungen</a>
    <a href="{{ url_for('bericht_route') }}">Genre-Bericht</a>
    <a href="{{ url_for('paradigmen_route') }}">Paradigmen</a>
</nav>
<main>
    {% block inhalt %}{% endblock %}
</main>
</body>
</html>
